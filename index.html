<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1a14">

    <title>Complejo Deportivo La Videna | Canchas de futsal, vóley y básquet</title>
    <meta name="description" content="Alquila canchas de futsal, vóley y básquet en el Complejo Deportivo La Videna. Conoce las canchas y consulta las tarifas de día y de noche.">
    <meta name="keywords" content="La Videna, complejo deportivo, canchas de futsal, vóley, básquet, alquiler de canchas">

    <meta property="og:title" content="Complejo Deportivo La Videna">
    <meta property="og:description" content="Canchas de futsal, vóley y básquet. Consulta nuestras instalaciones y tarifas.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_PE">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">

</head>
<body>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <!-- ENCABEZADO Y MENÚ -->
    <header class="encabezado">
        <div class="contenedor barra">
            <a class="marca" href="#inicio">
                <span class="marca-pequena">Complejo Deportivo</span>
                <span class="marca-nombre">La Videna</span>
            </a>

            <!-- Menú móvil solo con CSS: checkbox + label -->
            <input type="checkbox" id="menu-toggle" class="menu-check">
            <label for="menu-toggle" class="menu-boton" aria-label="Abrir o cerrar el menú">
                <span class="menu-icono" aria-hidden="true"></span>
            </label>

            <nav class="menu" aria-label="Navegación principal">
                <ul>
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#canchas">Canchas</a></li>
                    <li><a href="#tarifas">Tarifas</a></li>
                    <li><a href="#reservas">Reservas</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main id="contenido">
        <!-- PORTADA -->
        <section class="portada" id="inicio" aria-labelledby="titulo-portada">
            <img class="portada-imagen" src="img/portada.jpg" fetchpriority="high" decoding="async"
                alt="Vista amplia de una cancha de futsal techada con césped sintético y carteles de La Videna en la pared">
            <div class="contenedor portada-contenido">
                <p class="portada-etiqueta">Futsal · Vóley · Básquet</p>
                <h1 id="titulo-portada">Complejo Deportivo La Videna</h1>
                <p class="portada-frase">Reúne a tu equipo, sal a la cancha y disfruta del deporte con sana competencia.</p>
                <div class="portada-botones">
                    <a class="boton boton-primario" href="#canchas">Ver nuestras canchas</a>
                    <a class="boton boton-secundario" href="#tarifas">Consultar tarifas</a>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
